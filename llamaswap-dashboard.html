<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LlamaSwap Dashboard</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            color: #e0e0e0;
            min-height: 100vh;
            padding: 20px;
        }

        .header {
            text-align: center;
            padding: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 12px;
            margin-bottom: 20px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
        }

        .header h1 {
            font-size: 2em;
            color: white;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
        }

        .header p {
            color: rgba(255, 255, 255, 0.9);
            margin-top: 5px;
        }

        .dashboard {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }

        .card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.2);
        }

        .card h2 {
            color: #667eea;
            margin-bottom: 15px;
            font-size: 1.3em;
            border-bottom: 2px solid #667eea;
            padding-bottom: 8px;
        }

        .models-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 12px;
        }

        .model-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 8px;
            border-left: 4px solid #666;
            transition: all 0.3s ease;
        }

        .model-item.loaded {
            border-left-color: #00ff88;
            background: rgba(0, 255, 136, 0.1);
        }

        .model-item.unloaded {
            border-left-color: #ff6b6b;
            background: rgba(255, 107, 107, 0.05);
        }

        .model-name {
            font-weight: 600;
            font-size: 0.95em;
        }

        .model-status {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .status-badge {
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.85em;
            font-weight: 600;
        }

        .status-badge.loaded {
            background: #00ff88;
            color: #000;
        }

        .status-badge.unloaded {
            background: #ff6b6b;
            color: #000;
        }

        .model-details {
            font-size: 0.8em;
            color: #aaa;
            margin-top: 4px;
        }

        /* GPU Monitor */
        .gpu-info {
            display: grid;
            gap: 15px;
        }

        .gpu-item {
            padding: 12px;
            background: rgba(102, 126, 234, 0.2);
            border-radius: 8px;
        }

        .gpu-item label {
            font-size: 0.85em;
            color: #aaa;
            display: block;
        }

        .gpu-item .value {
            font-size: 1.2em;
            font-weight: 700;
            color: #667eea;
            margin-top: 5px;
        }

        .gpu-name {
            color: #00ff88;
            font-weight: 700;
            font-size: 1.1em;
            margin-bottom: 12px;
        }

        .gpu-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .gpu-grid .gpu-item.full-width {
            grid-column: 1 / -1;
        }

        /* Progress bar */
        .progress-bar {
            width: 100%;
            height: 8px;
            background: rgba(255,255,255,0.1);
            border-radius: 4px;
            margin-top: 6px;
            overflow: hidden;
        }

        .progress-bar .fill {
            height: 100%;
            border-radius: 4px;
            transition: width 0.5s ease;
        }

        .progress-bar .fill.green { background: #00ff88; }
        .progress-bar .fill.yellow { background: #ffd700; }
        .progress-bar .fill.red { background: #ff6b6b; }

        .summary {
            display: flex;
            gap: 20px;
            margin-top: 15px;
        }

        .summary-item {
            padding: 15px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 8px;
            text-align: center;
            flex: 1;
        }

        .summary-item .count {
            font-size: 2em;
            font-weight: 700;
        }

        .summary-item .label {
            font-size: 0.9em;
            color: #aaa;
            margin-top: 5px;
        }

        .logs-section {
            background: rgba(0, 0, 0, 0.3);
            border-radius: 8px;
            padding: 15px;
            max-height: 300px;
            overflow-y: auto;
            font-family: 'Consolas', 'Courier New', monospace;
            font-size: 0.85em;
        }

        .log-entry {
            margin: 4px 0;
            padding: 4px 8px;
            border-radius: 4px;
        }

        .log-entry.info {
            color: #66b3ff;
        }

        .log-entry.warn {
            color: #ffd700;
        }

        .log-entry.error {
            color: #ff6b6b;
        }

        .last-update {
            text-align: center;
            padding: 10px;
            color: #aaa;
            font-size: 0.9em;
            margin-top: 20px;
        }

        .loading {
            text-align: center;
            padding: 20px;
            color: #667eea;
        }

        .spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(102, 126, 234, 0.3);
            border-radius: 50%;
            border-top-color: #667eea;
            animation: spin 1s ease-in-out infinite;
            margin-right: 10px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .loading-text {
            animation: pulse 1.5s ease-in-out infinite;
        }

        .error-box {
            background: rgba(255, 107, 107, 0.2);
            border: 1px solid #ff6b6b;
            border-radius: 8px;
            padding: 15px;
            margin: 10px 0;
            color: #ff6b6b;
            display: none;
        }

        .loading-success {
            border-left-color: #00ff88;
        }

        @media (max-width: 768px) {
            .dashboard { grid-template-columns: 1fr; }
            .gpu-grid { grid-template-columns: 1fr; }
            .summary { flex-direction: column; }
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>🚀 LlamaSwap Dashboard</h1>
        <p>Monitoramento de Modelos em Tempo Real</p>
    </div>

    <div class="dashboard">
        <div class="card">
            <h2>📊 Status dos Modelos</h2>
            <div id="errorBox" class="error-box"></div>
            <div class="models-grid" id="modelsGrid">
                <div class="loading">
                    <span class="spinner"></span>
                    <span class="loading-text">Carregando modelos...</span>
                </div>
            </div>
            
            <div class="summary" id="summary" style="display: none;">
                <div class="summary-item">
                    <div class="count" id="readyCount" style="color: #00ff88;">0</div>
                    <div class="label">CARREGADOS</div>
                </div>
                <div class="summary-item">
                    <div class="count" id="stoppedCount" style="color: #ff6b6b;">0</div>
                    <div class="label">DESCARREGADOS</div>
                </div>
                <div class="summary-item">
                    <div class="count" id="totalCount" style="color: #667eea;">0</div>
                    <div class="label">TOTAL</div>
                </div>
            </div>
        </div>

        <div class="card">
            <h2>🖥️ GPU Monitor</h2>
            <div id="gpuInfo">
                <div class="loading">
                    <span class="spinner"></span>
                    <span class="loading-text">Carregando GPU...</span>
                </div>
            </div>
        </div>
    </div>

    <div class="card" style="margin-bottom: 20px;">
        <h2>📝 Logs do Serviço</h2>
        <div class="logs-section" id="logsSection">
            <div class="loading">
                <span class="spinner"></span>
                <span class="loading-text">Carregando logs...</span>
            </div>
        </div>
    </div>

    <div class="last-update" id="lastUpdate">
        Última atualização: --
    </div>

    <script>
        // Configuração
        const CONFIG = {
            baseUrl: 'http://192.168.1.114:8080',
            apiKey: 'turboquant-api-2026'
        };

        // Para rodar localmente com o servidor:
        //   npm install && npm start
        //   → http://localhost:8080

        // Função para fazer requisição com Authorization header
        async function fetchWithAuth(url) {
            try {
                const response = await fetch(url, {
                    headers: {
                        'Authorization': `Bearer ${CONFIG.apiKey}`
                    }
                });
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                const contentType = response.headers.get('content-type') || '';
                if (contentType.includes('json')) return await response.json();
                return await response.text();
            } catch (error) {
                console.error('Fetch error:', error);
                throw error;
            }
        }

        // Buscar modelos (polling)
        async function getModelStatus() {
            try {
                const data = await fetchWithAuth(`${CONFIG.baseUrl}/v1/models`);
                return data.data || [];
            } catch (error) {
                console.error('Erro ao buscar modelos:', error);
                return [];
            }
        }

        // Buscar métricas de GPU (polling)
        async function getGpuMetrics() {
            try {
                const text = await fetchWithAuth(`${CONFIG.baseUrl}/metrics`);
                return parsePrometheusMetrics(text);
            } catch (error) {
                console.error('Erro ao buscar métricas de GPU:', error);
                return null;
            }
        }

        // Parsear Prometheus metrics para objeto estruturado
        function parsePrometheusMetrics(text) {
            const result = {
                gpus: [],
                cpu_util: 0,
                memory_total: 0,
                memory_used: 0,
                memory_free: 0,
                swap_total: 0,
                swap_used: 0,
                load_average: { 1: 0, 5: 0, 15: 0 },
                gpu_temperature: [],
                gpu_vram_temperature: [],
                gpu_util_percent: 0,
                gpu_memory_util_percent: 0,
                gpu_memory_used: 0,
                gpu_memory_total: 0,
                gpu_fan_speed: 0,
                gpu_power_draw: 0,
            };

            const lines = text.split('\n').filter(l => l.trim() && !l.startsWith('# TYPE ') && !l.startsWith('# HELP'));
            for (const line of lines) {
                if (line.startsWith('#')) continue;
                
                // llamaswap_gpu_memory_used_bytes{id="...",name="...",uuid="..."} value
                const gpuMemUsed = line.match(/llamaswap_gpu_memory_used_bytes\{.*?name="([^"]+)".*?\}\s+([0-9.e+-]+)/);
                if (gpuMemUsed) {
                    const gpu = result.gpus.find(g => g.name === gpuMemUsed[1]);
                    if (gpu) gpu.memory_used = parseFloat(gpuMemUsed[2]);
                    continue;
                }

                const gpuMemTotal = line.match(/llamaswap_gpu_memory_total_bytes\{.*?name="([^"]+)".*?\}\s+([0-9.e+-]+)/);
                if (gpuMemTotal) {
                    const gpu = result.gpus.find(g => g.name === gpuMemTotal[1]);
                    if (gpu) gpu.memory_total = parseFloat(gpuMemTotal[2]);
                    continue;
                }

                const gpuNameMatch = line.match(/llamaswap_gpu_temperature_celsius\{.*?name="([^"]+)".*?\}\s+([0-9.]+)/);
                if (gpuNameMatch) {
                    result.gpus.push({
                        name: gpuNameMatch[1],
                        temperature: parseFloat(gpuNameMatch[2])
                    });
                    continue;
                }

                const gpuVRamTemp = line.match(/llamaswap_gpu_vram_temperature_celsius\{.*?name="([^"]+)".*?\}\s+([0-9.]+)/);
                if (gpuVRamTemp) {
                    const gpu = result.gpus.find(g => g.name === gpuVRamTemp[1]);
                    if (gpu) gpu.vram_temperature = parseFloat(gpuVRamTemp[2]);
                    continue;
                }

                const gpuUtil = line.match(/llamaswap_gpu_util_percent\{.*?name="([^"]+)".*?\}\s+([0-9.]+)/);
                if (gpuUtil) {
                    const gpu = result.gpus.find(g => g.name === gpuUtil[1]);
                    if (gpu) gpu.util_percent = parseFloat(gpuUtil[2]);
                    continue;
                }

                const gpuMemUtil = line.match(/llamaswap_gpu_memory_util_percent\{.*?name="([^"]+)".*?\}\s+([0-9.]+)/);
                if (gpuMemUtil) {
                    const gpu = result.gpus.find(g => g.name === gpuMemUtil[1]);
                    if (gpu) gpu.memory_util_percent = parseFloat(gpuMemUtil[2]);
                    continue;
                }

                const gpuFan = line.match(/llamaswap_gpu_fan_speed_percent\{.*?name="([^"]+)".*?\}\s+([0-9.]+)/);
                if (gpuFan) {
                    const gpu = result.gpus.find(g => g.name === gpuFan[1]);
                    if (gpu) gpu.fan_speed = parseFloat(gpuFan[2]);
                    continue;
                }

                const gpuPower = line.match(/llamaswap_gpu_power_draw_watts\{.*?name="([^"]+)".*?\}\s+([0-9.]+)/);
                if (gpuPower) {
                    const gpu = result.gpus.find(g => g.name === gpuPower[1]);
                    if (gpu) gpu.power_draw = parseFloat(gpuPower[2]);
                    continue;
                }

                const cpuMatch = line.match(/llamaswap_cpu_util_percent\{core="([^"]+)".*?\}\s+([0-9.]+)/);
                if (cpuMatch && result.cpu_cores !== undefined) {
                    result.cpu_cores.push({ core: parseInt(cpuMatch[1]), util: parseFloat(cpuMatch[2]) });
                    continue;
                }

                const memTotal = line.match(/llamaswap_memory_total_bytes\s+([0-9.]+)/);
                if (memTotal) { result.memory_total = parseFloat(memTotal[1]); continue; }

                const memUsed = line.match(/llamaswap_memory_used_bytes\s+([0-9.]+)/);
                if (memUsed) { result.memory_used = parseFloat(memUsed[1]); continue; }

                const memFree = line.match(/llamaswap_memory_free_bytes\s+([0-9.]+)/);
                if (memFree) { result.memory_free = parseFloat(memFree[1]); continue; }

                const swapTotal = line.match(/llamaswap_swap_total_bytes\s+([0-9.]+)/);
                if (swapTotal) { result.swap_total = parseFloat(swapTotal[1]); continue; }

                const swapUsed = line.match(/llamaswap_swap_used_bytes\s+([0-9.]+)/);
                if (swapUsed) { result.swap_used = parseFloat(swapUsed[1]); continue; }

                const loadMatch = line.match(/llamaswap_load_average\{interval="([^"]+)"\}\s+([0-9.]+)/);
                if (loadMatch) {
                    result.load_average[loadMatch[1]] = parseFloat(loadMatch[2]);
                    continue;
                }
            }

            // Calcular média de CPU
            if (result.cpu_cores && result.cpu_cores.length > 0) {
                result.cpu_util = Math.round(result.cpu_cores.reduce((a, b) => a + b.util, 0) / result.cpu_cores.length);
            }

            // Calcular médias GPU se múltiplas
            if (result.gpus.length > 0) {
                result.gpu_util_percent = Math.round(result.gpus.reduce((a, g) => a + (g.util_percent || 0), 0) / result.gpus.length);
                result.gpu_memory_util_percent = Math.round(result.gpus.reduce((a, g) => a + (g.memory_util_percent || 0), 0) / result.gpus.length);
                result.gpu_memory_used = result.gpus.reduce((a, g) => a + (g.memory_used || 0), 0);
                result.gpu_memory_total = result.gpus.reduce((a, g) => a + (g.memory_total || 0), 0);
                result.gpu_temperature = result.gpus[0]?.temperature ?? 0;
                result.gpu_vram_temperature = result.gpus[0]?.vram_temperature ?? 0;
                result.gpu_fan_speed = result.gpus[0]?.fan_speed ?? 0;
                result.gpu_power_draw = result.gpus[0]?.power_draw ?? 0;
            }

            return result;
        }

        // Buscar logs (polling)
        async function getLogs() {
            try {
                const response = await fetch(`${CONFIG.baseUrl}/logs`, {
                    headers: {
                        'Authorization': `Bearer ${CONFIG.apiKey}`
                    }
                });
                if (!response.ok) return '';
                return await response.text();
            } catch (error) {
                console.error('Erro ao buscar logs:', error);
                return '';
            }
        }

        function renderModels(models) {
            const grid = document.getElementById('modelsGrid');
            const summary = document.getElementById('summary');
            
            if (!models || models.length === 0) {
                grid.innerHTML = '<div class="loading">Nenhum modelo encontrado</div>';
                return;
            }

            let html = '';
            let loadedCount = 0;
            let unloadedCount = 0;

            models.forEach(model => {
                // A API retorna model.status.value === 'loaded' ou 'unloaded'
                const status = model.status?.value || model.state || 'unloaded';
                const isLoaded = status === 'loaded';
                if (isLoaded) loadedCount++;
                else unloadedCount++;

                let details = '';
                if (isLoaded && model.context_length) {
                    details = `Context: ${model.context_length} tokens`;
                }
                if (model.architecture?.context_window) {
                    details += (details ? ' | ' : '') + `Max: ${model.architecture.context_window} tokens`;
                }
                if (model.capabilities?.function_calling) {
                    details += (details ? ' | ' : '') + '🔧 Function Calling';
                }

                html += `
                    <div class="model-item ${status}">
                        <div>
                            <div class="model-name">${model.name}</div>
                            <div class="model-details">${details || 'Não carregado'}</div>
                        </div>
                        <div class="model-status">
                            <span class="status-badge ${status}">${isLoaded ? 'CARREGADO' : 'DESCARREGADO'}</span>
                        </div>
                    </div>
                `;
            });

            grid.innerHTML = html;
            summary.style.display = 'flex';
            document.getElementById('readyCount').textContent = loadedCount;
            document.getElementById('stoppedCount').textContent = unloadedCount;
            document.getElementById('totalCount').textContent = models.length;
        }

        function renderLogs(logs) {
            const logsSection = document.getElementById('logsSection');
            
            if (!logs || logs.length === 0) {
                logsSection.innerHTML = '<div class="log-entry">Nenhum log disponível</div>';
                return;
            }

            const logLines = logs.split('\n').filter(line => line.trim());
            let html = '';

            logLines.forEach(line => {
                let className = 'info';
                if (line.includes('[WARN]')) className = 'warn';
                if (line.includes('[ERROR]')) className = 'error';

                html += `<div class="log-entry ${className}">${line}</div>`;
            });

            logsSection.innerHTML = html;
        }

        function renderGpuMetrics(metrics) {
            const gpuInfo = document.getElementById('gpuInfo');
            
            if (!metrics || metrics.gpus.length === 0) {
                gpuInfo.innerHTML = '<div class="loading"><span class="spinner"></span><span class="loading-text">Sem dados de GPU</span></div>';
                return;
            }

            const gpu = metrics.gpus[0];
            const gpuName = gpu.name || 'GPU Desconhecida';
            
            // Formatar tamanhos
            function formatBytes(bytes) {
                if (bytes === 0) return '0 B';
                const gb = bytes / (1024 * 1024 * 1024);
                return gb.toFixed(2) + ' GB';
            }

            function formatMemory(mb) {
                if (mb === 0) return '0 MB';
                if (mb > 1024 * 1024 * 1024) {
                    return (mb / (1024 * 1024 * 1024)).toFixed(2) + ' GB';
                }
                return (mb / (1024 * 1024)).toFixed(0) + ' MB';
            }

            // Cores para barras de progresso
            function getBarColor(value) {
                if (value < 70) return 'green';
                if (value < 90) return 'yellow';
                return 'red';
            }

            let html = `<div class="gpu-name">🎮 ${gpuName}</div>`;
            
            // VRAM
            html += `
                <div class="gpu-grid">
                    <div class="gpu-item full-width">
                        <label>VRAM (Memória de Vídeo)</label>
                        <div class="value">${formatBytes(metrics.gpu_memory_used || 0)} / ${formatBytes(metrics.gpu_memory_total || 0)}</div>
                        <div class="progress-bar">
                            <div class="fill ${getBarColor(metrics.gpu_memory_util_percent || 0)}" style="width: ${metrics.gpu_memory_util_percent || 0}%"></div>
                        </div>
                        <div style="font-size: 0.8em; color: #aaa; margin-top: 4px;">${(metrics.gpu_memory_util_percent || 0).toFixed(1)}% utilizado</div>
                    </div>
                </div>
            `;

            // Temperatura e Fan
            html += `
                <div class="gpu-grid">
                    <div class="gpu-item">
                        <label>🌡️ Temperatura</label>
                        <div class="value">${gpu.temperature ?? '—'}°C</div>
                    </div>
                    <div class="gpu-item">
                        <label>💨 Ventoinha</label>
                        <div class="value">${gpu.fan_speed ?? '—'}%</div>
                    </div>
                </div>
            `;

            // Power e Utilização
            html += `
                <div class="gpu-grid">
                    <div class="gpu-item">
                        <label>⚡ Power Draw</label>
                        <div class="value">${gpu.power_draw != null ? gpu.power_draw.toFixed(1) + 'W' : '—'}</div>
                    </div>
                    <div class="gpu-item">
                        <label>📊 GPU Utilization</label>
                        <div class="value">${gpu.util_percent ?? '—'}%</div>
                    </div>
                </div>
            `;

            // RAM e CPU
            html += `
                <div class="gpu-grid">
                    <div class="gpu-item">
                        <label>💾 RAM Total</label>
                        <div class="value">${formatMemory(metrics.memory_total || 0)}</div>
                    </div>
                    <div class="gpu-item">
                        <label>💾 RAM Usada</label>
                        <div class="value">${formatMemory(metrics.memory_used || 0)}</div>
                        <div class="progress-bar">
                            <div class="fill ${getBarColor((metrics.memory_used / metrics.memory_total * 100) || 0)}" style="width: ${(metrics.memory_used / metrics.memory_total * 100) || 0}%"></div>
                        </div>
                    </div>
                </div>
            `;

            // CPU cores
            if (metrics.cpu_cores && metrics.cpu_cores.length > 0) {
                html += `
                    <div class="gpu-grid">
                        <div class="gpu-item">
                            <label>🖥️ CPU Load</label>
                            <div class="value">${metrics.cpu_util}% (${metrics.cpu_cores.length} cores)</div>
                        </div>
                        <div class="gpu-item">
                            <label>📈 Load Average</label>
                            <div class="value" style="font-size: 0.9em;">${metrics.load_average[1]?.toFixed(2) ?? '—'} / ${metrics.load_average[5]?.toFixed(2) ?? '—'} / ${metrics.load_average[15]?.toFixed(2) ?? '—'}</div>
                        </div>
                    </div>
                `;
            }

            // Swap
            if (metrics.swap_total > 0) {
                html += `
                    <div class="gpu-grid">
                        <div class="gpu-item">
                            <label>💿 Swap</label>
                            <div class="value">${formatMemory(metrics.swap_used || 0)} / ${formatMemory(metrics.swap_total)}</div>
                        </div>
                    </div>
                `;
            }

            gpuInfo.innerHTML = html;
        }

        function updateTimestamp() {
            document.getElementById('lastUpdate').textContent = 
                `Última atualização: ${new Date().toLocaleString('pt-BR')}`;
        }

        // Atualização principal
        async function updateDashboard() {
            try {
                // Buscar modelos
                const models = await getModelStatus();
                if (models && models.length > 0) {
                    renderModels(models);
                }
                
                // Buscar métricas de GPU
                const metrics = await getGpuMetrics();
                if (metrics && metrics.gpus.length > 0) {
                    renderGpuMetrics(metrics);
                } else {
                    // Tentar mostrar dados parciais mesmo sem GPUs
                    if (metrics) {
                        renderGpuMetrics(metrics);
                    }
                }
                
                // Buscar logs
                const logs = await getLogs();
                if (logs) {
                    renderLogs(logs);
                }
                
                updateTimestamp();
                hideError();
                
            } catch (error) {
                showError('Erro ao atualizar: ' + error.message);
                console.error(error);
            }
        }

        function showError(message) {
            const errorBox = document.getElementById('errorBox');
            errorBox.textContent = message;
            errorBox.style.display = 'block';
        }

        function hideError() {
            document.getElementById('errorBox').style.display = 'none';
        }

        // Iniciar polling a cada 3 segundos
        updateDashboard();
        setInterval(updateDashboard, 1000);
    </script>
</body>
</html>
